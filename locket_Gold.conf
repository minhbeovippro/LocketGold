[General]
#user-agent = Locket/2.70.0 (iPhone; iOS 16.6.1; Scale/3.00)

[Header Rewrite]
^https?://api.revenuecat.com/.+/(receipts$|subscribers/?(.*?)*$) header-del x-revenuecat-etag
^https?://api.revenuecat.com/.+/(receipts$|subscribers/?(.*?)*$) header-del X-RevenueCat-ETag

[Script]
#LocketGold
#hostname = api.revenuecat.com, api.rc-backup.com, firebaseremoteconfig.googleapis.com
revenuecat = type=http-response, pattern=^https:\/\/api\.(revenuecat|rc-backup)\.com\/.+\/(receipts$|subscribers\/[^/]+$), script-path=https://cdn.jsdelivr.net/gh/minhbeovippro/LocketGold@main/locket_unlock.js, requires-body=true, max-size=-1, timeout=60
deleteHeader = type=http-request, pattern=^https:\/\/api\.(revenuecat|rc-backup)\.com\/.+\/(receipts|subscribers), script-path=https://cdn.jsdelivr.net/gh/minhbeovippro/LocketGold@main//deleteHeader.js, timeout=60
locket_rc = type=http-response, pattern=^https:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+, script-path=https://cdn.jsdelivr.net/gh/minhbeovippro/LocketGold@main//locket_rc.js, requires-body=true, max-size=-1, timeout=60

[MITM]
hostname = %APPEND% api.revenuecat.com, api.rc-backup.com, firebaseremoteconfig.googleapis.com, api.locketcamera.com, cdn.jsdelivr.net
